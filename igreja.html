<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Igreja Vida Nova - Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
body{min-height:100dvh;background:#0a0f1e;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(1000px 500px at 50% -10%, rgba(245,158,11,0.22), transparent),linear-gradient(rgba(245,158,11,0.05) 1px, transparent 1px),linear-gradient(90deg, rgba(245,158,11,0.05) 1px, transparent 1px),#0a0f1e;background-size:auto,42px 42px,42px 42px,auto}
.card{box-shadow:0 0 0 1px rgba(245,158,11,0.2),0 0 60px rgba(245,158,11,0.28),0 25px 80px rgba(0,0,0,0.6)}
.desc::-webkit-scrollbar{width:6px}.desc::-webkit-scrollbar-thumb{background:#f59e0b;border-radius:10px}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.anim{animation:in.5s ease}
</style>
</head>
<body class="flex flex-col items-center pb-10">
<div class="bg"></div>
<h1 class="text-amber-100 font-black tracking-[0.4em] mt-6 text-[clamp(1.8rem,8vw,3rem)] drop-shadow-[0_0_20px_rgba(245,158,11,0.6)]">VIDA NOVA</h1>
<div class="relative w-[92vw] max-w-[420px] mt-4">
<button onclick="prev()" class="absolute -left-3 top-1/2 z-20 w-10 h-10 bg-white rounded-full shadow-lg">◀</button>
<button onclick="next()" class="absolute -right-3 top-1/2 z-20 w-10 h-10 bg-white rounded-full shadow-lg">▶</button>
<div id="card" class="card bg-white/10 backdrop-blur-xl rounded-[1.6rem] overflow-hidden border border-amber-500/20 anim">
<img id="img" src="https://images.unsplash.com/photo-1504052434569-70ad5836ab65?w=600" class="w-full aspect-[4/5] object-cover">
<div class="bg-[#1a1508] text-amber-100 px-5 py-3 flex justify-between"><p id="name" class="font-extrabold text-sm tracking-widest">PASTOR MARCOS</p><span id="role" class="text-[10px] bg-amber-600 px-2 py-1 rounded text-white">JOVENS</span></div>
<div class="bg-[#fffbeb]"><div class="px-5 py-3 bg-[#221c0a] text-amber-100 font-bold">Descrição</div><div id="desc" class="desc p-5 text-[14px] leading-6 text-zinc-700 max-h-[28vh] overflow-y-auto">Pastor Marcos lidera o Ministério de Jovens com paixão por Jesus. Cultos Sábado 19h30 com louvor, palavra e comunhão. Rua das Flores 123 - Cianorte PR. "Porque sou eu que conheço os planos que tenho para vocês" Jeremias 29:11.</div></div>
<div class="bg-[#221c0a] p-4"><a href="https://wa.me/5544999999999" target="_blank" class="block w-full bg-amber-500 text-white font-bold py-3 rounded-xl text-center hover:bg-amber-600">💬 Fale Conosco</a></div>
</div>
</div>
<div class="mt-6 flex gap-3">
<button onclick="go(0)" class="nav w-14 h-14 rounded-full bg-white border-2 border-amber-500 flex items-center justify-center text-xl shadow">🙏</button>
<button onclick="go(1)" class="nav w-14 h-14 rounded-full bg-white/60 flex items-center justify-center text-xl">👶</button>
<button onclick="go(2)" class="nav w-14 h-14 rounded-full bg-white/60 flex items-center justify-center text-xl">🎸</button>
<button onclick="go(3)" class="nav w-14 h-14 rounded-full bg-white/60 flex items-center justify-center text-xl">💑</button>
<button onclick="go(4)" class="nav w-14 h-14 rounded-full bg-white/60 flex items-center justify-center text-xl">🌍</button>
</div>
<script>
const data=[
{name:"PASTOR MARCOS",role:"JOVENS",img:"https://images.unsplash.com/photo-1504052434569-70ad5836ab65?w=600",desc:"Pastor Marcos lidera o Ministério de Jovens com paixão por Jesus. Cultos Sábado 19h30 com louvor, palavra e comunhão. Rua das Flores 123 - Cianorte PR. 'Porque sou eu que conheço os planos que tenho para vocês' Jeremias 29:11."},
{name:"TIA ANA",role:"KIDS",img:"https://images.unsplash.com/photo-1596462502275-27bfdd2a6894?w=600",desc:"Ministério Infantil com Tia Ana. Aulas lúdicas Domingo 9h para crianças 3 a 11 anos. Histórias bíblicas, brincadeiras e lanche. Espaço seguro e cheio de amor para seu filho conhecer Jesus."},
{name:"LOUVOR",role:"LOUVOR",img:"https://images.unsplash.com/photo-1514320290767-e2d6b037bb4d?w=600",desc:"Louvor que toca a alma. Ensaios Quinta 20h. Se você canta ou toca, venha fazer parte. Não precisa ser profissional, precisa ter coração adorador."},
{name:"CASAIS",role:"FAMÍLIA",img:"https://images.unsplash.com/photo-1529634597503-139d3726fed5?w=600",desc:"Ministério de Casais - Fortalecendo famílias. Encontro mensal 2º Sábado 19h com jantar e palestra. Comunicação, finanças e criação de filhos à luz da Bíblia."},
{name:"MISSÕES",role:"MISSÕES",img:"https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?w=600",desc:"Ide por todo o mundo - Marcos 16:15. Projeto missionário no sertão e apoio a 3 missionários. Como ajudar: oração, doação e indo. Próxima viagem em Julho."}
];
let i=0;
function render(){const d=data[i];document.getElementById('name').innerText=d.name;document.getElementById('role').innerText=d.role;document.getElementById('img').src=d.img;document.getElementById('desc').innerText=d.desc;document.querySelectorAll('.nav').forEach((b,k)=>{b.className=k===i?'nav w-14 h-14 rounded-full bg-white border-2 border-amber-500 flex items-center justify-center text-xl shadow':'nav w-14 h-14 rounded-full bg-white/60 flex items-center justify-center text-xl opacity-70'});const c=document.getElementById('card');c.classList.remove('anim');void c.offsetWidth;c.classList.add('anim')}
function next(){i=(i+1)%data.length;render()} function prev(){i=(i-1+data.length)%data.length;render()} function go(k){i=k;render()} render();
</script>
</body>
</html>
